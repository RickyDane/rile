[package]
name = "rile-server"
description = "Headless Rile Nearby device: shares folders of a (Linux) server with Rile apps on the LAN"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rile-remote.workspace = true
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
sysinfo.workspace = true
serde_json = "1"
log = "0.4"
clap = { version = "4.6.7", features = ["derive"] }
inquire = "0.9.4"
signal-hook = "0.4.5"
env_logger = { version = "0.11.11", default-features = false, features = ["humantime"] }
libc = "0.2.191"

[dev-dependencies]
tempfile.workspace = true
