[package]
name = "rile-services"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dunce.workspace = true
dirs.workspace = true
rayon.workspace = true
rile-core.workspace = true
anyhow.workspace = true
trash.workspace = true
chrono.workspace = true
# search
ignore = "0.4.23"
globset = { version = "0.4.16", default-features = false }
regex = "1.11"
grep-searcher = "0.1.14"
grep-regex = "0.1.13"
grep-matcher = "0.1.7"
# properties / preview
mime_guess = { version = "2.0.5", default-features = false }
infer = { version = "0.19", default-features = false, features = ["std"] }
# updater
ureq = { version = "3.0", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1.0"
sha2 = "0.10"
self-replace = "1.5"
flate2 = "1.0"
tar = { version = "0.4", default-features = false }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tempfile = "3"
# archives
sevenz-rust2 = { version = "0.20", default-features = false, features = ["compress"] }
brotli = "8"
zstd = "0.13"
# syntax highlighting
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Data_Pdf",
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "UI",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.dependencies]
windows-registry.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
uzers = { version = "0.12", default-features = false, features = ["cache"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
block2 = "0.6"
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType", "UTCoreTypes"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6"

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3"
default-features = false
features = ["std", "NSString", "NSData", "NSDictionary", "NSGeometry", "NSArray", "NSURL", "NSFileManager", "NSBundle", "NSError", "NSObject", "NSValue", "NSEnumerator", "NSUserDefaults"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3"
default-features = false
features = ["std", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "objc2-core-graphics", "block2", "objc2-uniform-type-identifiers"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-graphics]
version = "0.3"
default-features = false
features = ["std", "CGImage", "CGColorSpace", "CGContext", "CGBitmapContext", "CGGradient", "CGPDFDocument", "CGPDFPage", "CGPDFContext"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-vision]
version = "0.3"
default-features = false
features = ["std", "VNRequest", "VNRequestHandler", "VNClassifyImageRequest", "VNRecognizeTextRequest", "VNObservation", "VNTypes"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-foundation]
version = "0.3"
default-features = false
features = ["std", "CFCGTypes", "CFURL", "CFData", "CFString", "CFDictionary"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-image-io]
version = "0.3"
default-features = false
features = ["std", "CGImageSource", "CGImageProperties"]
