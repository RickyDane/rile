[package]
name = "rile-backup"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dunce.workspace = true
rile-core.workspace = true
rile-remote.workspace = true
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
chrono.workspace = true
serde_json = "1"
globset = { version = "0.4.16", default-features = false }
log = "0.4"
trash.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }
windows-registry.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
async-trait = "0.1"
libunftp = { version = "0.23", default-features = false, features = ["ring"] }
unftp-sbe-fs = "0.4"
unftp-core = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
