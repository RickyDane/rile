[package]
name = "rile-remote"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rile-core.workspace = true
anyhow.workspace = true
serde = { version = "1", features = ["derive"] }
dirs = "6"
log = "0.4"
url = "2"
percent-encoding = "2"
smb = { version = "=0.10.2", default-features = false, features = ["async", "sign", "encrypt"] }
futures-util = "0.3"
# Keep the SMB family aligned: 0.10.4 subcrates changed internal APIs.
smb-dtyp = "=0.10.2"
smb-fscc = "=0.10.2"
smb-msg = "=0.10.2"
smb-rpc = "=0.10.2"
smb-transport = { version = "=0.10.2", default-features = false }
# sspi 0.16 expects the pre-crypto-migration API; later picky prereleases break it.
picky = { version = "=7.0.0-rc.17", default-features = false }
mdns-sd = { version = "0.21.6", default-features = false, features = ["logging"] }
# FTP / FTPS (explicit TLS via rustls, ring crypto provider -> no system libs, no cmake)
suppaftp = { version = "12.2", features = ["rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
ring = "0.17"
# SFTP: pure-Rust SSH (ring crypto), driven by a private tokio runtime hidden behind the sync API
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync"] }
# Nearby devices (Rile ↔ Rile): self-signed identity certificates, JSON frames
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
serde_json = "1"
toml.workspace = true
# Google Drive / OneDrive: blocking HTTPS (rustls + ring, like the updater) and OAuth helpers
ureq = { version = "3.0", default-features = false, features = ["rustls"] }
chrono.workspace = true
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
security-framework = "3.7"
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "tokio", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
async-trait = "0.1"
libunftp = { version = "0.23", default-features = false, features = ["ring"] }
unftp-sbe-fs = "0.4"
unftp-core = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs", "io-util", "sync"] }
