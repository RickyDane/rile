<style>
*{box-sizing:border-box}body{margin:0;background:#1d1e21;color:#f1f2f5;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header,main,footer{max-width:1240px;margin:auto;padding:0 28px}header{padding-top:48px;padding-bottom:28px}.eyebrow{color:#8bbfff;font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}h1{font-size:36px;line-height:1.15;letter-spacing:-.04em;margin:10px 0}header p{max-width:720px;margin:0;color:#aeb3bd}a{color:#8bbfff;text-underline-offset:3px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;padding-bottom:36px}article{border:1px solid #ffffff12;border-radius:14px;background:#282a2e;overflow:hidden}.art{display:grid;place-items:center;padding:26px 24px;background:radial-gradient(ellipse at 50% 35%,#41444b,#25272b 78%)}.art svg{display:block;width:min(100%,240px);height:auto;aspect-ratio:1;filter:drop-shadow(0 13px 14px #0006)}.copy{padding:18px 20px 20px;display:flex;flex-direction:column;min-height:186px}.number{font-size:11px;font-weight:700;color:#8bbfff;letter-spacing:.08em}h2{margin:3px 0 5px;font-size:16px}.copy p{font-size:12px;color:#a5aab4;margin:0 0 18px}.sizes{margin-top:auto;display:flex;gap:14px;align-items:end}.sizes svg{width:32px;height:32px;filter:drop-shadow(0 2px 3px #0006)}.sizes svg:nth-of-type(2){width:20px;height:20px}.sizes span{font-size:10px;color:#9299a4;margin-left:auto}footer{padding-bottom:32px;font-size:12px;color:#9299a4}@media(max-width:350px){header,main,footer{padding-left:16px;padding-right:16px}main{grid-template-columns:1fr}}
</style>

<header><div class="eyebrow">Rile · App icon studies / 10</div><h1>A place for everything.</h1><p>Eight file-management directions. Drawers, folders, documents and browsing views become the composition itself—not a small explorer glyph dropped onto a flat tile.</p></header>
<main id="gallery"></main>
<footer>Original vector mockups · <a href="../round-9/">Previous set</a> · No changes to the installed app</footer>
<script>
const concepts=[
["cabinet","17 / ORGANIZE","File Cabinet","The entire icon is a pair of tactile drawers. Metal label holders and a blue lower drawer give file organization a physical identity."],
["folio","18 / COLLECT","Open Folio","A full-bleed tabbed portfolio with papers peeking out. Familiar file-management cues, treated as a layered object."],
["columns","19 / NAVIGATE","Column Trail","Three edge-to-edge browsing columns trace a selection from folder to folder to contents. A distinctly explorer-native direction."],
["breadcrumb","20 / EXPLORE","Folder Route","Two folder waypoints sit on a raised, turning path. A visual breadcrumb trail through your files."],
["transfer","21 / MANAGE","Exchange","Overlapping folded documents fill the canvas, connected by opposing arrows for moving, copying and syncing."],
["archive","22 / STORE","Archive Box","A blue archive box becomes the app tile, with an ivory lid, inset index label and a recessed pull."],
["inspect","23 / FIND","Close Look","A dimensional lens examines a folder on a large document stack. Search and inspection, not just a generic magnifying glass."],
["dualpane","24 / BROWSE","Side by Side","A miniature two-pane workspace fills the icon, with tabs, a folder list and a photo preview. Rile's browsing tools made tangible."]
];
function icon(id,large=false,name=""){
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("viewBox","0 0 256 256");
  if(large){svg.setAttribute("role","img");svg.setAttribute("aria-label",name+" app icon");}else svg.setAttribute("aria-hidden","true");
  const use=document.createElementNS(svg.namespaceURI,"use");use.setAttribute("href","#"+id);svg.append(use);return svg;
}
for(const [id,number,name,description] of concepts){
  const article=document.createElement("article"),art=document.createElement("div"),copy=document.createElement("div");
  art.className="art";art.append(icon(id,true,name));copy.className="copy";
  const label=document.createElement("span");label.className="number";label.textContent=number;
  const heading=document.createElement("h2");heading.textContent=name;
  const text=document.createElement("p");text.textContent=description;
  const sizes=document.createElement("div");sizes.className="sizes";
  const caption=document.createElement("span");caption.textContent="32 / 20 px";sizes.append(icon(id),icon(id),caption);
  copy.append(label,heading,text,sizes);article.append(art,copy);document.querySelector("#gallery").append(article);
}
</script>
