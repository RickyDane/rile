<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rile — eight more icon directions</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#1d1e21;color:#f1f2f5;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header,main,footer{max-width:1240px;margin:auto;padding:0 28px}header{padding-top:48px;padding-bottom:28px}.eyebrow{color:#8bbfff;font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}h1{font-size:36px;line-height:1.15;letter-spacing:-.04em;margin:10px 0}header p{max-width:670px;margin:0;color:#aeb3bd}a{color:#8bbfff;text-underline-offset:3px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;padding-bottom:36px}article{border:1px solid #ffffff12;border-radius:14px;background:#282a2e;overflow:hidden}.art{display:grid;place-items:center;padding:26px 24px;background:radial-gradient(ellipse at 50% 35%,#41444b,#25272b 78%)}.art svg{display:block;width:min(100%,240px);height:auto;aspect-ratio:1;filter:drop-shadow(0 13px 14px #0006)}.copy{padding:18px 20px 20px;display:flex;flex-direction:column;min-height:186px}.number{font-size:11px;font-weight:700;color:#8bbfff;letter-spacing:.08em}h2{margin:3px 0 5px;font-size:16px}.copy p{font-size:12px;color:#a5aab4;margin:0 0 18px}.sizes{margin-top:auto;display:flex;gap:14px;align-items:end}.sizes svg{width:32px;height:32px;filter:drop-shadow(0 2px 3px #0006)}.sizes svg:nth-of-type(2){width:20px;height:20px}.sizes span{font-size:10px;color:#9299a4;margin-left:auto}footer{padding-bottom:32px;font-size:12px;color:#9299a4}@media(max-width:350px){header,main,footer{padding-left:16px;padding-right:16px}main{grid-template-columns:1fr}}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" style="position:absolute">
<defs>
  <clipPath id="mask"><rect x="8" y="8" width="240" height="240" rx="53"/></clipPath>
  <linearGradient id="navy" x2="1" y2="1"><stop stop-color="#3a5470"/><stop offset="1" stop-color="#102238"/></linearGradient>
  <linearGradient id="ice" x2=".8" y2="1"><stop stop-color="#e3f8ff"/><stop offset=".45" stop-color="#91cff4"/><stop offset="1" stop-color="#3c7eb5"/></linearGradient>
  <linearGradient id="lilac" x2="1" y2="1"><stop stop-color="#ded5ff"/><stop offset="1" stop-color="#8877bd"/></linearGradient>
  <linearGradient id="peach" x2="1" y2="1"><stop stop-color="#ffedc9"/><stop offset="1" stop-color="#e69d78"/></linearGradient>
  <linearGradient id="teal" x2="1" y2="1"><stop stop-color="#c4f5e8"/><stop offset="1" stop-color="#4b9eac"/></linearGradient>
  <linearGradient id="silver" x2=".7" y2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#d3e5f2"/><stop offset="1" stop-color="#7f9bb4"/></linearGradient>
  <radialGradient id="light" cx=".2" cy=".05" r="1.1"><stop stop-color="#fff" stop-opacity=".16"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".2"/></radialGradient>
  <g id="finish"><rect x="8" y="8" width="240" height="240" rx="53" fill="url(#light)"/><rect x="9" y="9" width="238" height="238" rx="52" fill="none" stroke="#fff" stroke-opacity=".25"/></g>

  <symbol id="iris" viewBox="0 0 256 256">
    <g clip-path="url(#mask)">
      <rect width="256" height="256" fill="url(#navy)"/>
      <g transform="translate(128 128)">
        <path id="blade" d="M-160-160H30L71-41 0-82Z" fill="url(#ice)"/>
        <use href="#blade" transform="rotate(60)" fill-opacity=".93"/>
        <use href="#blade" transform="rotate(120)" fill-opacity=".83"/>
        <use href="#blade" transform="rotate(180)" fill-opacity=".72"/>
        <use href="#blade" transform="rotate(240)" fill-opacity=".82"/>
        <use href="#blade" transform="rotate(300)" fill-opacity=".93"/>
        <path d="m0-49 42 24v50L0 49l-42-24v-50Z" fill="#163a58"/>
        <path d="m0-49 42 24v50" fill="none" stroke="#d9f7ff" stroke-opacity=".65" stroke-width="2"/>
      </g>
      <use href="#finish"/>
    </g>
  </symbol>
  <symbol id="switchback" viewBox="0 0 256 256">
    <g clip-path="url(#mask)">
      <rect width="256" height="256" fill="url(#navy)"/>
      <path d="M-24 57h186a44 44 0 0 1 0 88H94a40 40 0 0 0 0 80h187" transform="translate(0 8)" fill="none" stroke="#081b30" stroke-opacity=".55" stroke-width="42"/>
      <path d="M-24 49h186a44 44 0 0 1 0 88H94a40 40 0 0 0 0 80h187" fill="none" stroke="url(#ice)" stroke-width="39"/>
      <path d="M-24 33h186a60 60 0 0 1 0 120H94a24 24 0 0 0 0 48h187" fill="none" stroke="#e5faff" stroke-opacity=".65" stroke-width="2"/>
      <circle cx="94" cy="137" r="12" fill="#fff0c9"/><circle cx="94" cy="137" r="5" fill="#4c8ab3"/>
      <use href="#finish"/>
    </g>
  </symbol>
  <symbol id="tilework" viewBox="0 0 256 256">
    <g clip-path="url(#mask)">
      <rect width="256" height="256" fill="#253c50"/>
      <path d="M0 0h146v80q0 28-28 28H0Z" fill="url(#ice)"/>
      <path d="M160 0h96v146h-68q-28 0-28-28Z" fill="url(#peach)"/>
      <path d="M256 160v96H110v-68q0-28 28-28Z" fill="url(#lilac)"/>
      <path d="M96 256H0V122h68q28 0 28 28Z" fill="url(#teal)"/>
      <path d="M0 2h144v78q0 26-26 26H0M162 0v118q0 26 26 26h68M256 162H138q-26 0-26 26v68M0 124h68q26 0 26 26v106" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
      <use href="#finish"/>
    </g>
  </symbol>
  <symbol id="echo" viewBox="0 0 256 256">
    <g clip-path="url(#mask)">
      <rect width="256" height="256" fill="url(#ice)"/>
      <circle cx="78" cy="176" r="180" fill="#255c83"/><circle cx="78" cy="176" r="151" fill="#9ed8e5"/><circle cx="78" cy="176" r="122" fill="#286b88"/><circle cx="78" cy="176" r="93" fill="#9de2df"/><circle cx="78" cy="176" r="64" fill="#357d91"/><circle cx="78" cy="176" r="35" fill="#dafbf0"/>
      <g fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2"><circle cx="78" cy="176" r="151"/><circle cx="78" cy="176" r="93"/><circle cx="78" cy="176" r="35"/></g>
      <circle cx="178" cy="63" r="19" fill="#173d57" opacity=".3"/><circle cx="178" cy="58" r="19" fill="url(#peach)"/>
      <use href="#finish"/>
    </g>
  </symbol>
  <symbol id="origami" viewBox="0 0 256 256">
    <g clip-path="url(#mask)">
      <rect width="256" height="256" fill="url(#lilac)"/>
      <path d="M-12 195 212 28 155 276 107 179Z" fill="#393b76" opacity=".3" transform="translate(0 10)"/>
      <path d="M-12 195 212 28 155 276 107 179Z" fill="url(#silver)"/>
      <path d="m107 179 105-151-57 248Z" fill="#91b8d9"/><path d="m107 179 105-151-77 176 20 72Z" fill="#4a749c"/>
      <path d="m-12 195 224-167-105 151Z" fill="#effaff"/>
      <path d="m-12 195 224-167-105 151" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="2"/>
      <use href="#finish"/>
    </g>
  </symbol>
  <symbol id="aurora" viewBox="0 0 256 256">
    <g clip-path="url(#mask)">
      <rect width="256" height="256" fill="url(#navy)"/>
      <path d="M-10-10H270V95C209 167 134 3-10 117Z" fill="url(#lilac)"/>
      <path d="M-10 120C94 6 181 182 270 88v60C174 249 84 75-10 188Z" fill="#122b49" opacity=".25"/>
      <path d="M-10 109C94-5 181 171 270 77v60C174 238 84 64-10 177Z" fill="url(#teal)"/>
      <path d="M-10 183C84 70 174 244 270 143v123H-10Z" fill="#0d263c" opacity=".4"/>
      <path d="M-10 176C84 63 174 237 270 136v130H-10Z" fill="url(#ice)"/>
      <path d="M-10 109C94-5 181 171 270 77M-10 176C84 63 174 237 270 136" fill="none" stroke="#efffff" stroke-opacity=".65" stroke-width="2"/>
      <use href="#finish"/>
    </g>
  </symbol>
  <symbol id="labyrinth" viewBox="0 0 256 256">
    <g clip-path="url(#mask)">
      <rect width="256" height="256" fill="url(#peach)"/>
      <path d="M-20 46h190q40 0 40 40v104q0 20-20 20H66q-20 0-20-20v-77q0-20 20-20h77q20 0 20 20v30q0 20-20 20h-35" fill="none" stroke="#775249" stroke-opacity=".3" stroke-width="27" transform="translate(0 5)"/>
      <path d="M-20 46h190q40 0 40 40v104q0 20-20 20H66q-20 0-20-20v-77q0-20 20-20h77q20 0 20 20v30q0 20-20 20h-35" fill="none" stroke="url(#silver)" stroke-width="24" stroke-linecap="round"/>
      <circle cx="108" cy="163" r="14" fill="#496f8b"/><circle cx="108" cy="163" r="6" fill="#ecfaff"/>
      <use href="#finish"/>
    </g>
  </symbol>
  <symbol id="keystone" viewBox="0 0 256 256">
    <g clip-path="url(#mask)">
      <rect width="256" height="256" fill="url(#navy)"/>
      <path d="M-12 256V-8h129c80 0 131 26 131 94 0 41-23 68-58 80l77 106h-86l-77-102H65v86Z" fill="#07192c" opacity=".5" transform="translate(0 9)"/>
      <path d="M-12 256V-8h129c80 0 131 26 131 94 0 41-23 68-58 80l77 106h-86l-77-102H65v86Z" fill="url(#ice)"/>
      <path d="M65 51v67h49c43 0 64-7 64-33 0-25-21-34-64-34Z" fill="#193d5a"/>
      <path d="M65 51v67h49c43 0 64-7 64-33" fill="none" stroke="#eefaff" stroke-opacity=".6" stroke-width="2"/>
      <path d="m104 170 77 102h25l-77-102Z" fill="#d9f3ff" opacity=".3"/>
      <use href="#finish"/>
    </g>
  </symbol>
</defs>
</svg>
<header><div class="eyebrow">Rile · App icon studies / 09</div><h1>Eight new perspectives.</h1><p>A fresh set of full-canvas compositions: optical, tactile, architectural and typographic. Original vector concepts, with actual-size checks below each design.</p></header>
<main id="gallery"></main>
<footer>Concepts only · <a href="../round-8/">Previous eight directions</a> · No changes to the installed app</footer>
<script>
const concepts=[
  ["iris","09 / FOCUS","Iris","Interlocking optical blades open onto a clear center. A cool, crystalline take on finding focus."],
  ["switchback","10 / NAVIGATION","Switchback","One continuous, raised path turns through the entire canvas. A warm waypoint anchors the journey."],
  ["tilework","11 / WORKSPACE","Tilework","Four softly rounded pieces fit together as a single object. A colorful, spatial identity for your workspace."],
  ["echo","12 / DISCOVERY","Echo","Offset concentric terraces fill the surface, with a small amber satellite marking the next discovery."],
  ["origami","13 / MOVEMENT","Airfold","A sharply folded paper wing cuts across a lavender field. Light, directional and deliberately oversized."],
  ["aurora","14 / FLOW","Aurora","Three sculpted color bands roll across the canvas. Calm motion, lit edges and soft depth."],
  ["labyrinth","15 / WAYFINDING","Inner Route","A continuous silver channel winds inward across a warm surface, ending at a blue destination."],
  ["keystone","16 / IDENTITY","Keystone","A monumental R becomes the icon itself: cropped, sculptural and unmistakably Rile."]
];
function icon(id,large=false,name=""){
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 256 256");
  if(large){svg.setAttribute("role","img");svg.setAttribute("aria-label",name+" app icon");}
  else svg.setAttribute("aria-hidden","true");
  const use=document.createElementNS(svg.namespaceURI,"use");use.setAttribute("href","#"+id);svg.append(use);return svg;
}
for(const [id,number,name,description] of concepts){
  const article=document.createElement("article");
  const art=document.createElement("div");art.className="art";art.append(icon(id,true,name));
  const copy=document.createElement("div");copy.className="copy";
  const label=document.createElement("span");label.className="number";label.textContent=number;
  const heading=document.createElement("h2");heading.textContent=name;
  const text=document.createElement("p");text.textContent=description;
  const sizes=document.createElement("div");sizes.className="sizes";
  const caption=document.createElement("span");caption.textContent="32 / 20 px";sizes.append(icon(id),icon(id),caption);
  copy.append(label,heading,text,sizes);article.append(art,copy);document.querySelector("#gallery").append(article);
}
</script>
</body>
</html>
