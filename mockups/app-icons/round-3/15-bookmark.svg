<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Rile — Keepsake</title>
  <desc id="desc">A deep red folder and a cream bookmark. A warmer direction centered on favorites and things worth keeping.</desc>
