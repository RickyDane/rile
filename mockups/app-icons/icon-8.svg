<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Rile — Glyph</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2d"/><stop offset="1" stop-color="#101012"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".08"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fc8f4"/><stop offset="1" stop-color="#3f72aa"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d4d6db"/>
    </linearGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6296cf"/><stop offset="1" stop-color="#2e5d93"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="3"/>
  <g filter="url(#soft)">
    <!-- leg: a slanted bar, sits behind the bowl -->
    <path d="M520 560H626L726 760H612Z" fill="url(#leg)"/>
    <!-- bowl: folder-tab-like half disc -->
    <path d="M412 264H556A148 148 0 0 1 556 560H412Z" fill="url(#bowl)"/>
    <circle cx="556" cy="412" r="54" fill="#18181a"/>
    <!-- stem -->
    <rect x="300" y="264" width="112" height="496" rx="22" fill="url(#stem)"/>
  </g>
</svg>
