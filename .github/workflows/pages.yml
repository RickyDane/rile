name: Deploy website to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check website
        run: |
          npm install --prefix /tmp/rile-website-check --no-audit --no-fund linkedom@0.18.14
          node --check website/js/main.js
          node website/tools/check.mjs

      - name: Stage public files
        run: |
          mkdir _site
          cp website/index.html _site/
          cp -R website/assets website/css website/js _site/

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
