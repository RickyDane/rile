[package]
name = "rile-plugin-hello"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Standalone project (excluded from the Rile workspace).
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.57"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
