  - generic [ref=e36]:
    - generic [ref=e37]: A note to the community
    - heading "The new Spacedrive is native" [level=2] [ref=e38]
    - generic [ref=e39]:
      - paragraph [ref=e40]: "I started Spacedrive because my files were scattered across laptops, external drives, a NAS, cloud folders, and phones that never talked to each other. The promise was simple: one app for all of it, built in the open and owned by the people using it. That promise resonated. The repo reached the top of GitHub, tens of thousands of developers followed along, and we raised funding from OSS Capital, Naval Ravikant, Tobias Lutke, and Tom Preston-Werner."
      - paragraph [ref=e41]: The open-source project proved the idea. But it grew heavy — a cross-platform stack carrying sync, cloud, a virtual filesystem, and every operating system at once. It worked. It was also slow to move, and it was never as fast as the app I had in my head.
      - paragraph [ref=e42]: So I built a new one from scratch. Native Rust, GPU-rendered, Mac-first. It scrolls a library of 129,000 photos at a locked 60fps with nothing loading in — no spinner, no decode on the hot path. It is the fastest photo app on macOS, and that is just the surface.
      - paragraph [ref=e43]: "Underneath, every photo, file, and note is the same thing: a record on one spine. A file stops being the primitive everything else has to pretend to be. That is what turns a fast photo grid into a private index of your whole digital life — files, photos, notes, and later email, people, and places — all searchable in one place, all on your machine."
      - paragraph [ref=e44]: This version ships differently. You buy it once. No cloud, no account, no subscription, no telemetry. It runs entirely on your computer and nothing leaves it. The open-source Spacedrive isn't going anywhere — it stays open and keeps its own path. This is the app I want to use every day.
      - paragraph [ref=e45]: The site is still quiet while the product catches up to the story. Demo coming soon.
      - paragraph [ref=e46]: Jamie Pine, Founder
